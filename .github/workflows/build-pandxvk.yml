name: Build PanDXVK-G57

on:
  workflow_dispatch:
  push:
    branches:
      - pandxvk-g57-1.10.3

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build glslang-tools mingw-w64

      - name: Select MinGW POSIX toolchain
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Build x64 and x32
        run: |
          chmod +x package-release.sh
          mkdir -p "$GITHUB_WORKSPACE/out"
          ./package-release.sh PanDXVK-G57-1.10.3 "$GITHUB_WORKSPACE/out" --no-package

      - name: Inspect build
        run: |
          find "$GITHUB_WORKSPACE/out" -type f -print
          echo "=== DLL SHA256 ==="
          find "$GITHUB_WORKSPACE/out" -type f -name "*.dll" -exec sha256sum {} \;

      - name: Create ZIP
        run: |
          cd "$GITHUB_WORKSPACE/out"
          zip -9 -r "PanDXVK-G57-1.10.3-${GITHUB_SHA:0:8}.zip" . -x "*.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanDXVK-G57-1.10.3
          path: out/PanDXVK-G57-1.10.3-*.zip
          if-no-files-found: error
