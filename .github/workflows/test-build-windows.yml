name: Test Builds on Windows

on: [push, pull_request, workflow_dispatch]

jobs:
  build-set-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup glslangValidator
      shell: pwsh
      run: |
        choco install vulkan-sdk -y
        Write-Output "$([System.Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine'))\Bin" `
          | Out-File -FilePath "${Env:GITHUB_PATH}" -Append

    - name: Setup Meson
      shell: pwsh
      run: pip install meson

    - name: Find Visual Studio
      shell: pwsh
      run: |
        $installationPath = Get-VSSetupInstance `
          | Select-VSSetupInstance -Require Microsoft.VisualStudio.Workload.NativeDesktop -Latest `
          | Select-Object -ExpandProperty InstallationPath
        Write-Output "VSDEVCMD=${installationPath}\Common7\Tools\VsDevCmd.bat" `
          | Out-File -FilePath "${Env:GITHUB_ENV}" -Append

    - name: Build MSVC x86
      shell: pwsh
      run: |
        & "${Env:COMSPEC}" /s /c "`"${Env:VSDEVCMD}`" -arch=x86 -host_arch=x64 -no_logo && set" `
          | % { , ($_ -Split '=', 2) } `
          | % { [System.Environment]::SetEnvironmentVariable($_[0], $_[1]) }
        meson --buildtype release --backend vs2022 build-msvc-x86
        msbuild -m build-msvc-x86/dxvk.sln

    - name: Build MSVC x64
      shell: pwsh
      run: |
        & "${Env:COMSPEC}" /s /c "`"${Env:VSDEVCMD}`" -arch=x64 -host_arch=x64 -no_logo && set" `
          | % { , ($_ -Split '=', 2) } `
          | % { [System.Environment]::SetEnvironmentVariable($_[0], $_[1]) }
        meson --buildtype release --backend vs2022 build-msvc-x64
        msbuild -m build-msvc-x64/dxvk.sln

    - name: Package PanDXVK-G57 x32 + x64
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force "PanDXVK-G57-2.0/x32" | Out-Null
        New-Item -ItemType Directory -Force "PanDXVK-G57-2.0/x64" | Out-Null

        $dlls = @("d3d9.dll", "d3d10core.dll", "d3d11.dll", "dxgi.dll")

        Write-Host "=== DLLs x86 ==="
        Get-ChildItem "build-msvc-x86" -Recurse -File -Filter "*.dll" |
          ForEach-Object { Write-Host $_.FullName }

        Write-Host "=== DLLs x64 ==="
        Get-ChildItem "build-msvc-x64" -Recurse -File -Filter "*.dll" |
          ForEach-Object { Write-Host $_.FullName }

        foreach ($dll in $dlls) {
          $x32 = @(Get-ChildItem "build-msvc-x86" -Recurse -File -Filter $dll)
          $x64 = @(Get-ChildItem "build-msvc-x64" -Recurse -File -Filter $dll)

          if ($x32.Count -ne 1) {
            $x32 | ForEach-Object { Write-Host "x32 candidate: $($_.FullName)" }
            throw "x32: expected exactly one $dll, found $($x32.Count)"
          }

          if ($x64.Count -ne 1) {
            $x64 | ForEach-Object { Write-Host "x64 candidate: $($_.FullName)" }
            throw "x64: expected exactly one $dll, found $($x64.Count)"
          }

          Copy-Item $x32[0].FullName "PanDXVK-G57-2.0/x32/$dll"
          Copy-Item $x64[0].FullName "PanDXVK-G57-2.0/x64/$dll"
        }

        Write-Host "=== PACKAGE FINAL ==="
        Get-ChildItem "PanDXVK-G57-2.0" -Recurse -File |
          ForEach-Object { Write-Host $_.FullName }

    - name: Upload PanDXVK-G57 2.0
      uses: actions/upload-artifact@v4
      with:
        name: PanDXVK-G57-2.0-${{ github.sha }}
        path: PanDXVK-G57-2.0
        if-no-files-found: error
